<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1040" width="880" height="1040" role="img" aria-labelledby="t d" font-family="IBM Plex Sans, Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Steppewise: one run, step by step</title>
<desc id="d">Seven steps. 1 Automated: a change request arrives and the run is logged. 2 Automated: the workflow drafts candidate-1 from a synthetic fixture. 3 Automated check fails: rollback plan missing; candidate-1 is kept. 4 Automated: repair, which always runs in v0.1.0, produces candidate-2; both candidates are kept with their own SHA-256 hashes. 5 Automated check passes on candidate-2; the run waits for a person. 6 Human decision: a person accepts or rejects candidate-2; the decision is bound to candidate-2's SHA-256 hash, and a stale hash is refused. 7 Automated: the run keeps a receipt, an append-only event log plus snapshots and local trace spans. Full text in WALKTHROUGH.md.</desc>
<rect width="880" height="1040" fill="#f7f5ef"></rect>
<text x="40" y="52" font-size="28" font-weight="700" fill="#1a1d1b">Steppewise: one run, step by step</text>
<text x="40" y="82" font-size="16" fill="#3d423e">service-intake example · v0.1.0 · synthetic fixtures, no live AI calls</text>
<g font-size="15" fill="#1a1d1b">
<rect x="40" y="104" width="20" height="20" fill="none" stroke="#1a1d1b" stroke-width="2"></rect><text x="70" y="119">Square = automated step or check</text>
<circle cx="350" cy="114" r="10" fill="none" stroke="#1f4690" stroke-width="3"></circle><text x="370" y="119">Circle = a person decides</text>
<text x="600" y="119">✓ Pass  ✕ Fail = check result</text>
</g>
<line x1="70" y1="160" x2="70" y2="930" stroke="#8d887b" stroke-width="2" stroke-dasharray="4 4"></line>
<g font-size="17" fill="#1a1d1b">
<g transform="translate(0,150)"><rect x="52" y="10" width="36" height="36" fill="#f7f5ef" stroke="#1a1d1b" stroke-width="2"></rect><text x="70" y="34" text-anchor="middle" font-weight="700">1</text>
<text x="110" y="26" font-weight="700" font-size="19">A change request arrives</text><text x="110" y="50" fill="#3d423e">Automated · run gets an ID; first log entry written before anything else</text></g>
<g transform="translate(0,250)"><rect x="52" y="10" width="36" height="36" fill="#f7f5ef" stroke="#1a1d1b" stroke-width="2"></rect><text x="70" y="34" text-anchor="middle" font-weight="700">2</text>
<text x="110" y="26" font-weight="700" font-size="19">Draft candidate-1</text><text x="110" y="50" fill="#3d423e">Automated · from a deterministic fixture · candidate = proposed result, not yet trusted</text></g>
<g transform="translate(0,350)"><rect x="52" y="10" width="36" height="36" fill="#f7f5ef" stroke="#1a1d1b" stroke-width="2"></rect><text x="70" y="34" text-anchor="middle" font-weight="700">3</text>
<text x="110" y="26" font-weight="700" font-size="19">Check candidate-1  ✕ Fail</text><text x="110" y="50" fill="#3d423e">Automated check · rollback plan missing · candidate-1 kept as evidence</text></g>
<g transform="translate(0,450)"><rect x="52" y="10" width="36" height="36" fill="#f7f5ef" stroke="#1a1d1b" stroke-width="2"></rect><text x="70" y="34" text-anchor="middle" font-weight="700">4</text>
<text x="110" y="26" font-weight="700" font-size="19">Repair → candidate-2</text><text x="110" y="50" fill="#3d423e">Automated · always runs in v0.1.0 · both candidates kept, each with its own hash</text>
<rect x="110" y="64" width="250" height="44" rx="4" fill="none" stroke="#8d887b" stroke-dasharray="5 4"></rect><text x="122" y="91" font-size="14" font-family="IBM Plex Mono, Consolas, monospace">candidate-1 · no rollback</text>
<rect x="376" y="64" width="270" height="44" rx="4" fill="#fff" stroke="#1a1d1b" stroke-width="2"></rect><text x="388" y="91" font-size="14" font-family="IBM Plex Mono, Consolas, monospace">candidate-2 · rollback added</text></g>
<g transform="translate(0,590)"><rect x="52" y="10" width="36" height="36" fill="#f7f5ef" stroke="#1a1d1b" stroke-width="2"></rect><text x="70" y="34" text-anchor="middle" font-weight="700">5</text>
<text x="110" y="26" font-weight="700" font-size="19">Check candidate-2  ✓ Pass</text><text x="110" y="50" fill="#3d423e">Automated check · run pauses and waits for a person</text></g>
<g transform="translate(0,690)"><rect x="96" y="-4" width="744" height="116" rx="16" fill="#eef2f9" stroke="#1f4690" stroke-width="3"></rect>
<circle cx="70" cy="28" r="19" fill="#f7f5ef" stroke="#1f4690" stroke-width="3"></circle><text x="70" y="34" text-anchor="middle" font-weight="700" fill="#1f4690">6</text>
<text x="116" y="26" font-weight="700" font-size="19">A person accepts or rejects candidate-2</text>
<text x="116" y="52" fill="#1a1d1b">Human decision · bound to candidate-2’s SHA-256 hash (its content fingerprint)</text>
<text x="116" y="76" fill="#1a1d1b">A stale hash or a second decision is refused (HTTP 409)</text>
<text x="116" y="98" fill="#3d423e" font-size="15">Reviewer name is self-reported, not authenticated</text></g>
<g transform="translate(0,830)"><rect x="52" y="10" width="36" height="36" fill="#f7f5ef" stroke="#1a1d1b" stroke-width="2"></rect><text x="70" y="34" text-anchor="middle" font-weight="700">7</text>
<text x="110" y="26" font-weight="700" font-size="19">Receipt kept: Accepted or Rejected</text><text x="110" y="50" fill="#3d423e">Append-only event log + snapshots + local trace spans</text>
<text x="110" y="74" fill="#3d423e" font-size="15" font-family="IBM Plex Mono, Consolas, monospace">run-&lt;id&gt;.events.jsonl · run-&lt;id&gt;.json · spans.jsonl</text></g>
</g>
<line x1="40" y1="950" x2="840" y2="950" stroke="#d6d2c6"></line>
<text x="40" y="980" font-size="15" fill="#3d423e">Reference implementation, not production. Loopback only · one host per evidence directory · no authentication.</text>
<text x="40" y="1004" font-size="15" fill="#3d423e">A truncated event log stops the whole host (per-run quarantine planned). See docs/STATUS.md.</text>
</svg>